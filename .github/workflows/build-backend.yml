name: Build Backend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ruby.api/**'
      - 'ruby.application/**'
      - 'ruby.domain/**'
      - 'ruby.infrastructure/**'
      - 'ruby.tests/**'
      - 'ruby-backend.slnx'
      - '.github/workflows/build-backend.yml'
  push:
    branches:
      - main
    paths:
      - 'ruby.api/**'
      - 'ruby.application/**'
      - 'ruby.domain/**'
      - 'ruby.infrastructure/**'
      - 'ruby.tests/**'
      - 'ruby-backend.slnx'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DOTNET_VERSION: '8.0.x'
      PROJECT_PATH: './ruby.api/ruby.api.csproj'
      TEST_PROJECT_PATH: './ruby.tests/ruby.tests.csproj'
      PUBLISH_DIR: './publish'
      ARTIFACT_NAME: 'ruby-backend-release.tar.gz'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore $PROJECT_PATH

      - name: Build application
        run: dotnet build $PROJECT_PATH -c Release --no-restore

      - name: Run tests
        run: dotnet test $TEST_PROJECT_PATH -c Release --logger trx

      - name: Publish backend
        run: dotnet publish $PROJECT_PATH -c Release -o $PUBLISH_DIR --no-restore

      - name: Package build artifact
        run: tar -czf $ARTIFACT_NAME -C $PUBLISH_DIR .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruby-backend-release
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
